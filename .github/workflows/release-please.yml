name: Release

on:
  push:
    branches: [main]

# release-please needs to open/update the release PR and push tags; the publish
# job additionally needs id-token for npm provenance.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Maintains a release PR from conventional-commit history. Merging it bumps the
  # version + CHANGELOG, tags the commit, and creates a GitHub release — which
  # flips `release_created` to true and triggers the publish job below.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A PAT (not the built-in GITHUB_TOKEN) so the release PR it opens
          # triggers the CI workflow — GITHUB_TOKEN is blocked from triggering
          # further workflow runs.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # Publishes the built CLI/library to npm only when a release was just cut.
  # Auth is via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. npm mints
  # short-lived credentials from the GitHub OIDC token and attaches provenance
  # automatically. Configure the trusted publisher on npmjs.com first (see AGENTS.md).
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: exchange for short-lived npm credentials + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Trusted publishing requires npm >= 11.5.1; Node 22 ships npm 10.x. We
      # publish with the npm CLI (not pnpm) since its OIDC support is the
      # reference implementation.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --access public
