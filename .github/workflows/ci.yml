name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Skip release-please's PR: its code is identical to main (only the version +
    # CHANGELOG move), so the gate/test/build is redundant there. main's own push
    # CI still validates everything after the PR merges.
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Gate (render matrix invariants)
        run: pnpm gate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify generated artifacts are committed
        # schemas/ and examples/ are generated; CI fails if they drift from source.
        run: |
          pnpm schemas
          pnpm goldens:update
          if ! git diff --quiet -- schemas examples; then
            echo "::error::Generated schemas/ or examples/ are out of date. Run 'pnpm schemas' and 'pnpm goldens:update' and commit."
            git --no-pager diff --stat -- schemas examples
            exit 1
          fi
